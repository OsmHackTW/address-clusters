name: Tileserver image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release to bundle (default is the latest release)
        type: string
        required: false
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download PMTiles
        id: data
        shell: python
        env:
          TAG: ${{ inputs.tag }}
        run: |
          import json, os, subprocess

          def gh(*args):
              return subprocess.run(["gh", "release", *args], check=True, capture_output=True, text=True).stdout

          latest = json.loads(gh("view", "--json", "tagName"))["tagName"]
          tag = os.environ["TAG"] or latest
          gh("download", tag, "--pattern", "cluster.pmtiles", "--dir", "data")

          image = "ghcr.io/" + os.environ["GITHUB_REPOSITORY"].lower()
          tags = [f"{image}:{tag}"]
          # Rebuilding an older release must not move "latest" back
          if tag == latest:
              tags.append(f"{image}:latest")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print("tags=" + ",".join(tags), file=out)

      - name: Log in to GHCR
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tileserver
          target: bundled
          build-contexts: data=data
          push: true
          tags: ${{ steps.data.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Raster tiles of address clusters in Taiwan, for JOSM
          cache-from: type=gha
          cache-to: type=gha,mode=max
